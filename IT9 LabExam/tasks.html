<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - Student Task Manager</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">

</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Student Task Manager</a>

    <div>
      <a class="nav-link d-inline text-white" href="index.html">Home</a>
      <a class="nav-link d-inline text-white" href="tasks.html">Tasks</a>
      <a class="nav-link d-inline text-white" href="about.html">About</a>

    </div>
  </div>
</nav>

<div class="tasks-container">

  <div class="task-heading">
    <div class="task-heading-icon">
      <i class="bi bi-clipboard2-check-fill"></i>
    </div>

    <div>
      <h1>My Tasks</h1>

      <p>Add, manage, and keep track of your tasks.</p>

    </div>

  </div>

  <div class="task-form-card">
    <div class="row g-3">
      <div class="col-lg-4">
        <label class="form-label">Task Title</label>
        <input type="text"
            id="taskTitle"
            class="form-control"
            placeholder="Enter task title">

      </div>

      <div class="col-lg-3">
        <label class="form-label">Due Date</label>
        <input type="date"
            id="dueDate"
            class="form-control">

      </div>

      <div class="col-lg-3">
        <label class="form-label">Priority</label>

        <select id="priority" class="form-select">
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>

      </div>

      <div class="col-lg-2 d-flex align-items-end">
        <button onclick="addTask()"
            class="btn add-task-btn w-100">
          <i class="bi bi-plus-lg"></i>Add Task</button>

      </div>

    </div>

    <p id="error" class="text-danger mt-2 mb-0"></p>

  </div>

  <div class="row g-3 mt-1">
    <div class="col-md-4">
      <div class="counter-card">
        <div class="counter-icon blue">
          <i class="bi bi-list-task"></i>

        </div>

        <div>

          <p>Total Tasks</p>

          <h2 id="total">0</h2>

        </div>

      </div>

    </div>

    <div class="col-md-4">
      <div class="counter-card">
        <div class="counter-icon orange">
          <i class="bi bi-clock"></i>

        </div>

        <div>
          <p>Pending</p>
          <h2 id="pending">0</h2>

        </div>

      </div>

    </div>

    <div class="col-md-4">
      <div class="counter-card">
        <div class="counter-icon green">
          <i class="bi bi-check-circle"></i>
        </div>

        <div>
          <p>Completed</p>
          <h2 id="completed">0</h2>

        </div>
      </div>
    </div>
  </div>

  <div class="search-area mt-4">
    <div class="search-box">
      <i class="bi bi-search"></i>

      <input type="text"
          id="search"
          placeholder="Search tasks..."
          onkeyup="displayTasks()">

    </div>

    <button onclick="clearAll()" class="clear-btn">
      <i class="bi bi-trash"></i>Clear All</button>

  </div>

  <div class="task-table-card mt-3">

    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th>Task Title</th>
            <th>Due Date</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Actions</th>

          </tr>
        </thead>

        <tbody id="taskList">

        </tbody>

      </table>

    </div>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
