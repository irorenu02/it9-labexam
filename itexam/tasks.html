<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">
        Student Task Manager
    </a>

    <div>
      <a class="nav-link d-inline text-white" href="index.html">Home</a>
      <a class="nav-link d-inline text-white" href="tasks.html">Tasks</a>
      <a class="nav-link d-inline text-white" href="about.html">About</a>

    </div>
  </div>
</nav>

<div class="container mt-4">

  <h2>My Tasks</h2>
  <p>Add and manage your school tasks.</p>
  <div class="card p-3 mb-4">
    <div class="row g-2">

      <div class="col-md-4">
        <label for="taskTitle" class="visually-hidden">Task title</label>
        <input type="text" id="taskTitle"
            class="form-control"
            placeholder="Task title"
            aria-label="Task title">

      </div>
      <div class="col-md-3">
        <label for="dueDate" class="visually-hidden">Due date</label>
        <input type="date" id="dueDate"
            class="form-control"
            aria-label="Due date"
            title="Due date">

      </div>
      <div class="col-md-3">
        <label for="priority" class="visually-hidden">Priority</label>
        <select id="priority" class="form-select" aria-label="Priority" title="Priority">
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>

      </div>
      <div class="col-md-2">
        <button onclick="addTask()"
            class="btn btn-primary w-100">

          Add Task

        </button>
      </div>
    </div>

    <p id="error" class="text-danger mt-2"></p>

  </div>

  <div class="row text-center mb-3">

    <div class="col-md-4">
      <div class="card p-3">
        <h5>Total</h5>
        <h3 id="total">0</h3>
      </div>

    </div>

    <div class="col-md-4">
      <div class="card p-3">
        <h5>Pending</h5>
        <h3 id="pending">0</h3>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3">
        <h5>Completed</h5>
        <h3 id="completed">0</h3>
      </div>

    </div>



  </div>
  
  <input type="text"
      id="search"
      class="form-control mb-3"
      placeholder="Search tasks..."
      onkeyup="displayTasks()">

  <div class="table-responsive">
    <table class="table table-bordered table-hover">
        <thead class="table-white bg-white text-dark">
        <tr>
          <th>#</th>
          <th>Task</th>
          <th>Due Date</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>

      </thead>
      <tbody id="taskList"></tbody>
    </table>

  </div>
  <button onclick="clearAll()"
      class="btn btn-danger">
      
      Clear All
    </button>

</div>
<script src="script.js"></script>
</body>
</html>
